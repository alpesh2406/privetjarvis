name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write API key into Config.kt
        run: |
          cat > app/src/main/java/com/ravan/jarvis/Config.kt << EOF
          package com.ravan.jarvis

          object Config {
              const val GROQ_API_KEY = "${{ secrets.GROQ_API_KEY }}"
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateJarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
